name: 问题反馈
description: 报告行情、数据、性能、展示或交互问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        感谢参与 Dragon Quant 公开测试。请尽量提供可复现的信息，方便定位数据源、缓存或界面问题。

        请勿在反馈中粘贴 API Key、访问令牌、Cookie 或其他个人敏感信息。
  - type: input
    id: browser
    attributes:
      label: 浏览器与设备
      description: 例如：macOS 15 + Chrome 128，或 iPhone Safari
      placeholder: 浏览器、版本、操作系统和设备
    validations:
      required: true
  - type: input
    id: occurred_at
    attributes:
      label: 发生时间
      description: 尽量填写当地时间，便于对照行情接口日志
      placeholder: 2026-09-03 14:30（Asia/Singapore）
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - 市场总览
        - 龙头列表
        - 个股详情
        - 历史趋势
        - 基金页面
        - 交易与复盘
        - 加载速度或刷新
        - 移动端布局
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按操作顺序列出，必要时附页面链接或标的代码
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 描述错误提示、空数据、乱码、卡顿或其他异常
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你认为页面应该如何表现
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或控制台信息
      description: 可拖拽截图；日志请先移除令牌、Cookie 和个人信息
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认反馈中不包含 API Key、访问令牌、Cookie 或其他敏感信息
          required: true
